version: "2"
run:
  build-tags:
    - integration
linters:
  default: none
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  fix: true
formatters:
  enable:
    - gci
    - goimports
  settings:
    gci:
      sections:
        - Standard
        - Default
        - Prefix(github.com/ARM-software)
    goimports:
      local-prefixes:
        - github.com/ARM-software
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # gci and goimports both move build constraints ahead of copyright headers.
      - ^utils/filesystem/files_(posix|unix_test|windows)\.go$
      - ^utils/platform/(cmd|deletion|homedir|os|users)_(posix|unix|darwin|windows)(_amd64|_arm64)?\.go$
      - ^utils/proc/(find/find_(linux|linux_test|other)|group_attr_(darwin|linux|windows)|ps_(posix|windows))\.go$
