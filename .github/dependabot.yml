version: 2
updates:
- package-ecosystem: gomod
  directories:
    - "/utils"
    - "/utils/**"
  schedule:
    interval: daily
    timezone: Europe/London
  open-pull-requests-limit: 10
  rebase-strategy: disabled
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    timezone: Europe/London
  open-pull-requests-limit: 10
  rebase-strategy: disabled
