name: Go multimodules
description: Discover all Go modules, run checks, and publish per-module JUnit and coverage reports.
inputs:
  task:
    description: 'list, build, download, analyze, generate, lint, or verify'
    required: false
    default: verify
  artifact-prefix:
    description: Prefix for uploaded JUnit and coverage artifacts (including any separator).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Run Go module task
      shell: bash
      env:
        GO_MODULE_TASK: ${{ inputs.task }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        case "$GO_MODULE_TASK" in
          list|build|download|analyze|generate|lint|verify) ;;
          *) echo "Unknown Go module task: $GO_MODULE_TASK" >&2; exit 2 ;;
        esac

        found="$(mktemp)"
        modules="$(mktemp)"
        trap 'rm -f "$found" "$modules"' EXIT
        find . -type f -name go.mod -not -path './.git/*' -not -path './artifacts/*' -print |
          sed 's@/go.mod$@@' | LC_ALL=C sort > "$found"
        if [[ -f go.work ]]; then
          workspace="$(go work edit -json)"
          printf '%s\n' "$workspace" |
            sed -n 's/^[[:space:]]*"DiskPath": "\([^"]*\)".*$/\1/p' |
            LC_ALL=C sort > "$modules"
        else
          cp "$found" "$modules"
        fi
        if [[ ! -s "$modules" ]] || ! diff -u "$found" "$modules"; then
          echo 'go.work must enumerate every go.mod directory' >&2
          exit 1
        fi

        if [[ "$GO_MODULE_TASK" == list ]]; then
          cat "$modules"
          exit 0
        fi
        if [[ "$GO_MODULE_TASK" != verify ]]; then
          while IFS= read -r module; do
            echo "$GO_MODULE_TASK $module"
            case "$GO_MODULE_TASK" in
              build) (cd "$module" && go build -v ./...) ;;
              download) (cd "$module" && GOWORK=off go mod download) ;;
              analyze) (cd "$module" && go test ./... -run TestDoesNotExist) ;;
              generate) (cd "$module" && go generate ./...) ;;
              lint) (cd "$module" && golangci-lint run ./...) ;;
            esac
          done < "$modules"
          exit 0
        fi

        artifacts="$PWD/artifacts"
        mkdir -p "$artifacts/junit" "$artifacts/coverage"
        rm -f "$artifacts/junit/"*.xml "$artifacts/coverage/"*.out "$artifacts/module-results.tsv" "$artifacts/failed-tests.tsv"
        results="$artifacts/module-results.tsv"
        failures="$artifacts/failed-tests.tsv"
        : > "$results"
        : > "$failures"
        failed=0
        while IFS= read -r module; do
          echo "verify $module"
          key="${module#./}"
          key="${key//\//__}"
          if [[ "$key" == . ]]; then key=root; fi
          junit="$artifacts/junit/$key.xml"
          profile="$artifacts/coverage/$key.out"
          generate=pass lint=pass test=pass coverage='not available'
          if ! (cd "$module" && go generate ./...); then
            generate=fail lint=skipped test=skipped
            printf '%s\t%s\n' "$module" 'Tests skipped because generation failed' >> "$failures"
            failed=1
          else
            if ! (cd "$module" && golangci-lint run ./... --verbose --output.text.print-issued-lines --output.text.print-linter-name --output.tab.colors --max-issues-per-linter 0 --max-same-issues 0); then
              lint=fail
              failed=1
            fi
            if ! (cd "$module" && gotestsum --format standard-verbose --junitfile "$junit" -- -race -covermode=atomic -coverprofile "$profile" -tags integration -timeout 30m ./...); then
              test=fail
              failed=1
              if [[ -f "$junit" ]]; then
                awk -v module="$module" '
                  /<testcase[[:space:]]/ {
                    classname=$0; sub(/.*classname="/, "", classname); sub(/".*/, "", classname)
                    name=$0; sub(/.* name="/, "", name); sub(/".*/, "", name)
                    testcase=classname "/" name
                  }
                  /<(failure|error)([[:space:]>])/ && testcase != "" {
                    print module "\t" testcase; found=1
                  }
                  END { if (!found) print module "\tNo failed test case in JUnit (see test log)" }
                ' "$junit" >> "$failures"
              else
                printf '%s\t%s\n' "$module" 'JUnit report unavailable (see test log)' >> "$failures"
              fi
            fi
            if [[ ! -f "$junit" ]]; then failed=1; fi
            if [[ -f "$profile" ]]; then
              if [[ $(wc -l < "$profile") -le 1 ]]; then
                coverage='n/a (no statements)'
              elif coverage="$(cd "$module" && go tool cover "-func=$profile" | awk '$1=="total:" {print $NF}')" && [[ -n "$coverage" ]]; then
                :
              else
                coverage='unavailable (invalid profile)'
                failed=1
              fi
            else
              coverage='missing profile'
              failed=1
            fi
          fi
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$module" "$generate" "$lint" "$test" "$coverage" "$key.xml" "$key.out" >> "$results"
        done < "$modules"

        combined="$artifacts/coverage/combined.out"
        printf 'mode: atomic\n' > "$combined"
        while IFS= read -r module; do
          key="${module#./}"
          key="${key//\//__}"
          if [[ "$key" == . ]]; then key=root; fi
          profile="$artifacts/coverage/$key.out"
          if [[ -f "$profile" ]]; then
            if [[ "$(head -n 1 "$profile")" != 'mode: atomic' ]]; then
              failed=1
              continue
            fi
            awk 'NR > 1' "$profile" >> "$combined"
          fi
        done < "$modules"
        total='n/a (no covered statements)'
        if [[ $(wc -l < "$combined") -gt 1 ]]; then
          if total="$(go tool cover "-func=$combined" | awk '$1=="total:" {print $NF}')" && [[ -n "$total" ]]; then
            :
          else
            total='unavailable (invalid combined profile)'
            failed=1
          fi
        fi
        printf '%s\n' "$total" > "$artifacts/combined-coverage.txt"
        exit "$failed"
    - name: Upload JUnit reports
      if: ${{ always() && inputs.task == 'verify' }}
      id: junit
      uses: actions/upload-artifact@v4
      with:
        name: "${{ inputs.artifact-prefix }}junit-xml"
        path: ${{ github.workspace }}/artifacts/junit/*.xml
        if-no-files-found: error
    - name: Upload coverage profiles
      if: ${{ always() && inputs.task == 'verify' }}
      id: coverage
      uses: actions/upload-artifact@v4
      with:
        name: "${{ inputs.artifact-prefix }}coverage"
        path: ${{ github.workspace }}/artifacts/coverage/*.out
        if-no-files-found: error
    - name: Publish Go module summary
      if: ${{ always() && inputs.task == 'verify' }}
      shell: bash
      env:
        JUNIT_ARTIFACT_URL: ${{ steps.junit.outputs.artifact-url }}
        COVERAGE_ARTIFACT_URL: ${{ steps.coverage.outputs.artifact-url }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        artifacts="$PWD/artifacts"
        summary="$GITHUB_STEP_SUMMARY"
        printf '## Go multimodules verification\n\n' >> "$summary"
        if [[ ! -s "$artifacts/module-results.tsv" ]]; then
          printf 'Module results were not produced; see the workflow log.\n\n' >> "$summary"
        else
          count="$(wc -l < "$artifacts/module-results.tsv")"
          printf 'Modules checked: **%s**\n\n' "$count" >> "$summary"
          printf '| Module | Generate | Lint | Tests | Coverage | JUnit XML | Coverage profile |\n' >> "$summary"
          printf '| --- | --- | --- | --- | --- | --- | --- |\n' >> "$summary"
          while IFS=$'\t' read -r module generate lint test coverage junit_name profile_name; do
            junit_report='not generated'
            profile_report='not generated'
            if [[ -f "$artifacts/junit/$junit_name" ]]; then
              junit_report="$junit_name (upload unavailable)"
              if [[ -n "$JUNIT_ARTIFACT_URL" ]]; then junit_report="[$junit_name]($JUNIT_ARTIFACT_URL)"; fi
            fi
            if [[ -f "$artifacts/coverage/$profile_name" ]]; then
              profile_report="$profile_name (upload unavailable)"
              if [[ -n "$COVERAGE_ARTIFACT_URL" ]]; then profile_report="[$profile_name]($COVERAGE_ARTIFACT_URL)"; fi
            fi
            printf '| `%s` | %s | %s | %s | %s | %s | %s |\n' "$module" "$generate" "$lint" "$test" "$coverage" "$junit_report" "$profile_report" >> "$summary"
          done < "$artifacts/module-results.tsv"
          printf '\n### Failed tests\n\n' >> "$summary"
          if [[ -s "$artifacts/failed-tests.tsv" ]]; then
            while IFS=$'\t' read -r module name; do
              key="${module#./}"
              key="${key//\//__}"
              if [[ "$key" == . ]]; then key=root; fi
              junit_link='JUnit report unavailable'
              if [[ -n "$JUNIT_ARTIFACT_URL" && -f "$artifacts/junit/$key.xml" ]]; then
                junit_link="[JUnit: $key.xml]($JUNIT_ARTIFACT_URL)"
              fi
              name="${name//|/\\|}"
              printf -- '- `%s`: `%s` - %s\n' "$module" "$name" "$junit_link" >> "$summary"
            done < "$artifacts/failed-tests.tsv"
          else
            printf 'None.\n' >> "$summary"
          fi
          printf '\n### Combined coverage\n\n' >> "$summary"
          total='coverage unavailable'
          if [[ -f "$artifacts/combined-coverage.txt" ]]; then total="$(cat "$artifacts/combined-coverage.txt")"; fi
          if [[ -n "$COVERAGE_ARTIFACT_URL" ]]; then
            printf -- '- %s - [combined.out and per-module profiles](%s)\n' "$total" "$COVERAGE_ARTIFACT_URL" >> "$summary"
          else
            printf -- '- %s - coverage artifact upload unavailable\n' "$total" >> "$summary"
          fi
        fi
        printf '\n' >> "$summary"
        if [[ -n "$JUNIT_ARTIFACT_URL" ]]; then printf '[Download all per-module JUnit XML reports](%s)\n' "$JUNIT_ARTIFACT_URL" >> "$summary"; fi
        if [[ -n "$COVERAGE_ARTIFACT_URL" ]]; then printf '[Download per-module and combined coverage](%s)\n' "$COVERAGE_ARTIFACT_URL" >> "$summary"; fi
        printf '\n[Open the complete workflow run](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$summary"
