name: CI

on:
  push:
    branches: [ master ]
    tags-ignore:
      - '**'
  pull_request:
    branches: [ master ]

env:
  go_version: "1.26.1"
  python_version: '3.11'

jobs:
  assert-news:
    name: Assert news files (See CONTRIBUTING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}
      - uses: FranzDiebold/github-env-vars-action@v2
      - name: Install CI/CD tools
        run: python -m pip install --upgrade continuous-delivery-scripts && pip list
      - name: Assert news
        run: cd-assert-news -b "${CI_ACTION_REF_NAME}"
        env:
          GIT_TOKEN: ${{ secrets.ARM_SOFTWARE_TOKEN }}
      - name: Report failure if needed
        if: ${{ failure() }}
        run: |
          echo "::error:: News file missing (See CONTRIBUTING.md guide for details)."

  tpip:
    name: Check third-party IP
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}
      - name: Install CI/CD tools
        run: python -m pip install --upgrade continuous-delivery-scripts && pip list
      - name: Sync workspace
        uses: $/actions/sync-go-workspace
      - name: Download Go dependencies for every module
        uses: $/actions/go-multimodules
        with:
          task: download
      - name: Check third-party IP
        run: cd-check-licence-compliance

  detect-secrets:
    name: Check for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install CI/CD tools
        run: python -m pip install --upgrade 'continuous-delivery-scripts>=4.8.0' && pip list
      - name: Check for secrets with CDS
        run: cd-detect-secrets

  verify-go-modules:
    name: Generate, lint, test, and cover Go modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Sync workspace
        uses: $/actions/sync-go-workspace
      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - name: Set up gotestsum
        uses: $/actions/setup-gotestsum
        with:
          version: v1.13.0
      - name: Run generate, lint, tests, and coverage
        uses: $/actions/go-multimodules
        with:
          task: verify
          build-tags: integration

  build-all-modules:
    name: Build all modules
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        multi-platform:
          - ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
        exclude:
          - os: macOS-latest
            multi-platform: false
          - os: windows-latest
            multi-platform: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Sync workspace
        uses: $/actions/sync-go-workspace
      - name: Build modules on ${{ matrix.os }}
        uses: $/actions/go-multimodules
        with:
          task: build
          build-tags: integration
