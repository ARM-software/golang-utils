name: CI

on:
  push:
    branches: [ master ]
    tags-ignore:
      - '**'
  pull_request:
    branches: [ master ]

env:
  go_version: "1.26.1"
  python_version: '3.11'

jobs:
  assert-news:
    name: Assert news files (See CONTRIBUTING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}
      - uses: FranzDiebold/github-env-vars-action@v2
      - name: Install CI/CD tools
        run: python -m pip install --upgrade continuous-delivery-scripts && pip list
      - name: Assert news
        run: cd-assert-news -b "${CI_ACTION_REF_NAME}"
        env:
          GIT_TOKEN: ${{ secrets.ARM_SOFTWARE_TOKEN }}
      - name: Report failure if needed
        if: ${{ failure() }}
        run: |
          echo "::error:: News file missing (See CONTRIBUTING.md guide for details)."

  tpip:
    name: Check third-party IP
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}
      - name: Install CI/CD tools
        run: python -m pip install --upgrade continuous-delivery-scripts && pip list
      - name: Sync workspace
        uses: $/actions/sync-go-workspace
      - name: Download Go dependencies for every module
        uses: $/actions/go-multimodules
        with:
          task: download
      - name: Check third-party IP
        run: cd-check-licence-compliance

  detect-secrets:
    name: Check for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install CI/CD tools
        run: python -m pip install --upgrade 'continuous-delivery-scripts>=4.8.0' && pip list
      - name: Check for secrets with CDS
        run: cd-detect-secrets

  verify-go-modules:
    name: Generate, lint, test, and cover Go modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Sync workspace
        uses: $/actions/sync-go-workspace
      - name: Set up golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-only: true
      - name: Set up gotestsum
        uses: $/actions/setup-gotestsum
        with:
          version: v1.13.0
      - name: Run generate, lint, tests, and coverage
        uses: $/actions/go-multimodules
        with:
          task: verify
          build-tags: integration

  verify-platform-specific-go-modules:
    name: Test platform-specific Go modules
    strategy:
      matrix:
        include:
          - name: safecast on linux/386
            runs-on: ubuntu-latest
            modules: ./utils/safecast
            go-os: linux
            go-arch: 386
            race: 'false'
            artifact-prefix: safecast-linux-386-
            report-name: Safecast tests on linux/386
          - name: filesystem on Linux
            runs-on: ubuntu-latest
            modules: ./utils/filesystem
            artifact-prefix: filesystem-linux-
            report-name: Filesystem tests on Linux
          - name: filesystem on macOS
            runs-on: macOS-latest
            modules: ./utils/filesystem
            artifact-prefix: filesystem-macos-
            report-name: Filesystem tests on macOS
          - name: filesystem on Windows
            runs-on: windows-latest
            modules: ./utils/filesystem
            artifact-prefix: filesystem-windows-
            report-name: Filesystem tests on Windows
          - name: platform on Linux
            runs-on: ubuntu-latest
            modules: ./utils/platform
            artifact-prefix: platform-linux-
            report-name: Platform tests on Linux
          - name: platform on macOS
            runs-on: macOS-latest
            modules: ./utils/platform
            artifact-prefix: platform-macos-
            report-name: Platform tests on macOS
          - name: platform on Windows
            runs-on: windows-latest
            modules: ./utils/platform
            artifact-prefix: platform-windows-
            report-name: Platform tests on Windows
          - name: proc on Linux
            runs-on: ubuntu-latest
            modules: ./utils/proc
            artifact-prefix: proc-linux-
            report-name: Proc tests on Linux
          - name: proc on macOS
            runs-on: macOS-latest
            modules: ./utils/proc
            artifact-prefix: proc-macos-
            report-name: Proc tests on macOS
          - name: proc on Windows
            runs-on: windows-latest
            modules: ./utils/proc
            artifact-prefix: proc-windows-
            report-name: Proc tests on Windows
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: ${{ matrix.modules }}/go.sum
      - name: Sync workspace
        uses: $/actions/sync-go-workspace
      - name: Set up gotestsum
        uses: $/actions/setup-gotestsum
        with:
          version: v1.13.0
      - name: Run ${{ matrix.name }}
        uses: $/actions/test-go-modules
        with:
          modules: ${{ matrix.modules }}
          go-os: ${{ matrix.go-os }}
          go-arch: ${{ matrix.go-arch }}
          race: ${{ matrix.race }}
          artifact-prefix: ${{ matrix.artifact-prefix }}
          report-name: ${{ matrix.report-name }}

  build-all-modules:
    name: Build all modules
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        multi-platform:
          - ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
        exclude:
          - os: macOS-latest
            multi-platform: false
          - os: windows-latest
            multi-platform: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - name: Sync workspace
        uses: $/actions/sync-go-workspace
      - name: Build modules on ${{ matrix.os }}
        uses: $/actions/go-multimodules
        with:
          task: build
          build-tags: integration
