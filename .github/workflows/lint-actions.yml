name: Lint GitHub Actions workflows

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: '-ignore=[$]/actions/'
