name: GitHub Release

env:
  go_version: "1.26.1"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description:
          "Enter type of release to perform (i.e. development, beta, release):"
        required: true

jobs:
  release:
    name: Carry out a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: FranzDiebold/github-env-vars-action@v2
      - name: Install CI/CD tools
        run: python -m pip install --upgrade continuous-delivery-scripts && pip list
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          distribution: goreleaser
          version: latest
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Sync workspace
        run: go work sync
      - name: Download Go dependencies for every module
        shell: pwsh
        run: |
          $work = go work edit -json | ConvertFrom-Json
          foreach ($module in @($work.Use | ForEach-Object { $_.DiskPath } | Sort-Object)) {
            Push-Location $module
            $env:GOWORK = 'off'
            go mod download
            if ($LASTEXITCODE -ne 0) {
              Pop-Location
              exit $LASTEXITCODE
            }
            Pop-Location
          }
      - name: Tag and release
        run: cd-tag-and-release -b ${CI_ACTION_REF_NAME} -t ${{ github.event.inputs.release_type }} -vv
        env:
          GIT_TOKEN: ${{ secrets.ARM_SOFTWARE_TOKEN }}
