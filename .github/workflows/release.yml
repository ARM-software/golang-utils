name: GitHub Release

env:
  go_version: "1.26.1"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description:
          "Enter type of release to perform (i.e. development, beta, release):"
        required: true

jobs:
  release:
    name: Carry out a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.ARM_SOFTWARE_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go_version }}
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: FranzDiebold/github-env-vars-action@v2
      - name: Install CI/CD tools
        run: python -m pip install --upgrade continuous-delivery-scripts && pip list
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          distribution: goreleaser
          version: latest
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Sync workspace
        run: go work sync
      - name: Download Go dependencies for every module
        shell: pwsh
        run: |
          $work = go work edit -json | ConvertFrom-Json
          foreach ($module in @($work.Use | ForEach-Object { $_.DiskPath } | Sort-Object)) {
            Push-Location $module
            $env:GOWORK = 'off'
            go mod download
            if ($LASTEXITCODE -ne 0) {
              Pop-Location
              exit $LASTEXITCODE
            }
            Pop-Location
          }
      - name: Prepare CDS multi-module requirements
        if: ${{ github.event.inputs.release_type != 'development' }}
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          version="$(cd-determine-version -t "$RELEASE_TYPE")"
          python prepare_go_release.py "$version"
          git add -- ':(glob)utils/**/go.mod' utils/go.mod
          if ! git diff --cached --quiet; then
            git commit -m "bugfix: :gear: prepare CDS Go modules for v$version [skip ci]"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
      - name: Tag and release
        run: cd-tag-and-release -b ${CI_ACTION_REF_NAME} -t ${{ github.event.inputs.release_type }} -vv
        env:
          GIT_TOKEN: ${{ secrets.ARM_SOFTWARE_TOKEN }}
