name: Sync Go workspace
description: Synchronize the root go.work workspace and its Go module dependencies.
runs:
  using: composite
  steps:
    - name: Sync workspace
      shell: bash
      env:
        GOPROXY: 'https://proxy.golang.org|direct'
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        go work sync
