[ProjectConfig]
# Only path variables can and must contain 'DIR', 'PATH' or 'ROOT' in their name as
# these tokens are used to identify path variables from other variable types.
PROJECT_NAME = "Golang Utilities"
PACKAGE_NAME = "golang-utils"
PROJECT_UUID = '5e7ed86f-7c3b-4d78-96f8-2b92106f1f86'
PROJECT_ROOT = "."
NEWS_DIR = "changes/"
SOURCE_DIR = "utils"
RELEASE_BRANCH_PATTERN = "^release.*$"
MODULE_TO_DOCUMENT = "golang-utils"
DOCUMENTATION_DEFAULT_OUTPUT_PATH = "./docs"
DOCUMENTATION_PRODUCTION_OUTPUT_PATH = "./docs"
GENERATE_LICENSING_SUMMARY_ON_RELEASE = true
VERSION_FILE_PATH = "utils/module.properties"
CHANGELOG_FILE_PATH = "CHANGELOG.md"
AWS_BUCKET=""
PROGRAMMING_LANGUAGE = "Golang"
FAIL_ON_INCOMPLETE_LICENCE_AUDIT = true

[ProjectConfig.PACKAGES_WITH_CHECKED_LICENCE]
"github.com/cyphar/filepath-securejoin" = "BSD-3-Clause AND MPL-2.0"
"github.com/emirpasic/gods" = "BSD-2-Clause AND ISC"
"github.com/klauspost/compress" = "BSD-3-Clause AND Apache-2.0 AND MIT"
"github.com/stretchr/testify/internal/spew" = "ISC accepted for this project as a transitive test dependency."
"sigs.k8s.io/yaml" = "MIT AND BSD-3-Clause"

[ProjectConfig.REVIEWED_LICENCE_ASSESSMENTS."github.com/cyphar/filepath-securejoin"]
licence = "BSD-3-Clause AND MPL-2.0"
reason = "Reviewed the MPL-2.0 obligations for this unmodified dependency and will retain the required notices."

[ProjectConfig.REVIEWED_LICENCE_ASSESSMENTS."github.com/hashicorp/errwrap"]
licence = "MPL-2.0"
reason = "Used indirectly through go-multierror in utils/commonerrors for error wrapping helpers. This is acceptable provided the dependency remains unmodified in distribution artifacts, MPL-2.0 notices and licence text are retained, and any future modifications to MPL-covered files are made available under MPL-2.0."

[ProjectConfig.REVIEWED_LICENCE_ASSESSMENTS."github.com/hashicorp/go-cleanhttp"]
licence = "MPL-2.0"
reason = "Used directly in utils/http to create isolated pooled HTTP clients and transports. This is acceptable provided the dependency remains unmodified in distribution artifacts, MPL-2.0 notices and licence text are retained, and any future modifications to MPL-covered files are made available under MPL-2.0."

[ProjectConfig.REVIEWED_LICENCE_ASSESSMENTS."github.com/hashicorp/go-multierror"]
licence = "MPL-2.0"
reason = "Used directly in utils/commonerrors to aggregate multiple errors. This is acceptable provided the dependency remains unmodified in distribution artifacts, MPL-2.0 notices and licence text are retained, and any future modifications to MPL-covered files are made available under MPL-2.0."

[ProjectConfig.REVIEWED_LICENCE_ASSESSMENTS."github.com/hashicorp/go-retryablehttp"]
licence = "MPL-2.0"
reason = "Used directly in utils/http to implement retryable HTTP client behavior and request handling. This is acceptable provided the dependency remains unmodified in distribution artifacts, MPL-2.0 notices and licence text are retained, and any future modifications to MPL-covered files are made available under MPL-2.0."

[AutoVersionConfig]
CONFIG_NAME = "JAVA"
PRERELEASE_TOKEN = "beta"
BUILD_TOKEN = "dev"
TAG_TEMPLATE = "release/{version}"
targets = [ "utils/module.properties",]

[AutoVersionConfig.key_aliases]
Version = "VERSION_KEY"
MajorVersion = "major"
MinorVersion = "minor"
PatchVersion = "patch"
CommitHash = "COMMIT"

[AutoVersionConfig.trigger_patterns]
major = "changes/*.major"
minor = "changes/*.feature"
patch = "changes/*.bugfix"

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
package = "golang_utils"
title_format = "{version} ({project_date})"
start_string = """
[//]: # (begin_release_notes)
"""

[[tool.towncrier.type]]
directory = "major"
name = "Major changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false

[spdx]
CreatorWebsite = "spdx.org"
PathToSpdx = "spdx/spdxdocs"
UUID="d9e2187c-30b4-11eb-adc1-0242ac120002"
